<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý sinh viên</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 p-4">

  <div class="mx-auto max-w-6xl py-4">
    <header class="mb-6 flex flex-wrap items-center justify-between gap-4">
      <h1 class="text-2xl font-bold">Quản lý sinh viên</h1>
      <button type="button" id="btnOpenForm" class="rounded bg-blue-600 px-3 py-2 text-sm font-bold text-white">
        Thêm sinh viên
      </button>
    </header>

    <section class="mb-6 grid gap-4 sm:grid-cols-2" aria-label="Thống kê">
      <div class="rounded border bg-white p-4">
        <span class="block text-sm text-gray-600">Tổng số sinh viên</span>
        <span id="statTotal" class="mt-1 text-2xl font-bold text-blue-600">0</span>
      </div>
      <div class="rounded border bg-white p-4">
        <span class="block text-sm text-gray-600">Điểm trung bình lớp</span>
        <span id="statAverage" class="mt-1 text-2xl font-bold text-green-600">0</span>
      </div>
    </section>

    <div id="messageArea" class="mb-4 hidden rounded border border-blue-200 bg-blue-50 p-3 text-sm text-blue-900" role="status" aria-live="polite"></div>

    <section class="rounded border bg-white" aria-label="Danh sách sinh viên">
      <div class="overflow-x-auto">
        <table class="w-full border-collapse border text-left text-sm">
          <thead class="border-b bg-gray-100 font-bold">
            <tr>
              <th scope="col" class="border px-3 py-2">Mã SV</th>
              <th scope="col" class="border px-3 py-2">Họ và tên</th>
              <th scope="col" class="border px-3 py-2">Ngày sinh</th>
              <th scope="col" class="border px-3 py-2">Lớp học</th>
              <th scope="col" class="border px-3 py-2">Điểm TB</th>
              <th scope="col" class="border px-3 py-2">Email</th>
              <th scope="col" class="border px-3 py-2 text-right">Chỉnh sửa</th>
            </tr>
          </thead>
          <tbody id="studentTableBody">
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <div id="modalOverlay" class="fixed inset-0 z-50 hidden bg-black/50 p-4" role="presentation">
    <div id="studentModal" class="mx-auto mt-20 max-h-[90vh] w-full max-w-md overflow-y-auto rounded border bg-white p-4" role="dialog" aria-labelledby="modalTitle" aria-modal="true">
      <h2 id="modalTitle" class="mb-4 text-xl font-bold">Thêm sinh viên</h2>

      <form id="studentForm" class="space-y-4" novalidate>
        <div>
          <label for="inputMaSV" class="mb-1 block text-sm font-bold">Mã sinh viên</label>
          <input type="text" id="inputMaSV" name="maSV" placeholder="VD: SV001" required class="w-full rounded border px-3 py-2">
          <p id="errMaSV" class="mt-1 hidden text-xs text-red-600"></p>
        </div>

        <div>
          <label for="inputHoTen" class="mb-1 block text-sm font-bold">Họ và tên</label>
          <input type="text" id="inputHoTen" name="hoTen" placeholder="Họ tên" required class="w-full rounded border px-3 py-2">
          <p id="errHoTen" class="mt-1 hidden text-xs text-red-600"></p>
        </div>

        <div>
          <label for="inputNgaySinh" class="mb-1 block text-sm font-bold">Ngày sinh</label>
          <input type="date" id="inputNgaySinh" name="ngaySinh" required class="w-full rounded border px-3 py-2">
          <p id="errNgaySinh" class="mt-1 hidden text-xs text-red-600"></p>
        </div>

        <div>
          <label for="inputLopHoc" class="mb-1 block text-sm font-bold">Lớp học</label>
          <select id="inputLopHoc" name="lopHoc" class="w-full rounded border bg-white px-3 py-2">
            <option value="">-- Chọn lớp --</option>
            <option value="66HTTT1">66HTTT1</option>
            <option value="66HTTT2">66HTTT2</option>
          </select>
          <p id="errLopHoc" class="mt-1 hidden text-xs text-red-600"></p>
        </div>

        <div>
          <label for="inputDiemTB" class="mb-1 block text-sm font-bold">Điểm trung bình</label>
          <input type="number" id="inputDiemTB" name="diemTB" min="0" max="10" step="0.01" class="w-full rounded border px-3 py-2">
          <p id="errDiemTB" class="mt-1 hidden text-xs text-red-600"></p>
        </div>

        <div>
          <label for="inputEmail" class="mb-1 block text-sm font-bold">Email</label>
          <input type="email" id="inputEmail" name="email" placeholder="email@example.com" class="w-full rounded border px-3 py-2">
          <p id="errEmail" class="mt-1 hidden text-xs text-red-600"></p>
        </div>

        <div class="flex flex-wrap gap-2 pt-2">
          <button type="submit" id="btnSave" class="min-w-[6rem] flex-1 rounded bg-blue-600 px-3 py-2 text-sm font-bold text-white">Lưu</button>
          <button type="button" id="btnCancel" class="min-w-[6rem] flex-1 rounded border bg-white px-3 py-2 text-sm font-bold">Hủy</button>
        </div>
      </form>
    </div>
  </div>

  <script defer src="app.js"></script>
</body>
</html>
