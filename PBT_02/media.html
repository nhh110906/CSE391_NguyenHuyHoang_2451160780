<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media — Shop Hoàng</title>
    <style>
        img, video {
            max-width: 100%;
            height: auto;
        }
        figure {
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Giới thiệu sản phẩm — Shop Hoàng</h1>
        <img src="https://placehold.co/800x120/3498db/ffffff?text=Shop+Hoang+Banner" alt="Banner Shop Hoàng" width="800" height="120">
    </header>

    <main>
        <h2>Hình ảnh sản phẩm</h2>
        <p>Ảnh banner tải ngay; ảnh sản phẩm bên dưới dùng <code>loading="lazy"</code>.</p>

        <figure>
            <img src="https://placehold.co/400x300/2c3e50/ffffff?text=Laptop+A" alt="Laptop A — máy học tập giá rẻ cho sinh viên" width="400" height="300" loading="lazy">
            <figcaption>Laptop A — 10.900.000đ</figcaption>
        </figure>

        <figure>
            <img src="https://placehold.co/400x300/27ae60/ffffff?text=Laptop+B" alt="Laptop B — hiệu năng cao cho lập trình" width="400" height="300" loading="lazy">
            <figcaption>Laptop B — 15.900.000đ</figcaption>
        </figure>

        <figure>
            <img src="https://placehold.co/400x300/8e44ad/ffffff?text=Laptop+C" alt="Laptop C — mỏng nhẹ pin trâu" width="400" height="300" loading="lazy">
            <figcaption>Laptop C — 12.900.000đ</figcaption>
        </figure>

        <h2>Video giới thiệu cửa hàng</h2>
        <video controls width="560" poster="https://placehold.co/560x315/1abc9c/ffffff?text=Video+poster">
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm" type="video/webm">
            <source src="https://www.w3schools.com/html/mov_bbb.ogg" type="video/ogg">
            Trình duyệt của bạn không hỗ trợ thẻ video.
        </video>

        <h2>Âm thanh giới thiệu</h2>
        <audio controls>
            <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
            <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-audio/t-rex-roar.mp3" type="audio/mpeg">
            Trình duyệt của bạn không hỗ trợ thẻ audio.
        </audio>
    </main>

    <footer>
        <p>&copy; 2026 Shop Hoàng — hoang@example.com</p>
    </footer>
</body>
</html>
