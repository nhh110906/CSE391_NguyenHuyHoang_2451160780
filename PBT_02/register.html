<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký — Shop Hoàng</title>
</head>
<body>
    <header>
        <h1>Shop Hoàng — Đăng ký tài khoản</h1>
    </header>

    <form action="#" method="post">
        <fieldset>
            <legend>Thông tin cá nhân</legend>

            <label for="name">Họ tên:</label>
            <input type="text" id="name" name="name" placeholder="Nguyễn Huy Hoàng" required minlength="2" maxlength="50">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="hoang@example.com" required>

            <label for="phone">Số điện thoại:</label>
            <input type="tel" id="phone" name="phone" placeholder="Nhập 10 chữ số" pattern="[0-9]{10}" required>

            <label for="dob">Ngày sinh:</label>
            <input type="date" id="dob" name="dob" required>
        </fieldset>

        <fieldset>
            <legend>Tài khoản</legend>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="3-20 ký tự" pattern="^[a-zA-Z0-9_]{3,20}$" required>

            <label for="password">Mật khẩu:</label>
            <input type="password" id="password" name="password" minlength="8" placeholder="Tối thiểu 8 ký tự, có chữ hoa và số" pattern="^(?=.*[A-Z])(?=.*[0-9]).+$" required>

            <label for="confirm">Xác nhận mật khẩu:</label>
            <input type="password" id="confirm" name="confirm" minlength="8" placeholder="Nhập lại mật khẩu" pattern="^(?=.*[A-Z])(?=.*[0-9]).+$" required>
        </fieldset>

        <fieldset>
            <legend>Thông tin giao hàng</legend>

            <label for="city">Thành phố:</label>
            <select id="city" name="city" required>
                <option value="">-- Chọn --</option>
                <option value="hn">Hà Nội</option>
                <option value="hcm">TP.HCM</option>
                <option value="dn">Đà Nẵng</option>
                <option value="hp">Hải Phòng</option>
            </select>

            <label for="district">Quận/Huyện:</label>
            <select id="district" name="district" required>
                <option value="q1">Quận 1</option>
                <option value="q2">Quận 2</option>
                <option value="q3">Quận 3</option>
            </select>

            <label for="address">Địa chỉ chi tiết:</label>
            <textarea id="address" name="address" rows="3" placeholder="Số nhà, tên đường..." required></textarea>

            <p>Giới tính:</p>
            <label><input type="radio" name="gender" value="male" required> Nam</label>
            <label><input type="radio" name="gender" value="female"> Nữ</label>
            <label><input type="radio" name="gender" value="other"> Khác</label>
        </fieldset>

        <p>
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">Tôi đồng ý điều khoản</label>
        </p>

        <button type="submit">Đăng ký</button>
        <button type="reset">Nhập lại</button>
    </form>

    <script>
        const dob = document.getElementById("dob");
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, "0");
        const dd = String(today.getDate()).padStart(2, "0");
        dob.max = `${yyyy}-${mm}-${dd}`;
    </script>
</body>
</html>
