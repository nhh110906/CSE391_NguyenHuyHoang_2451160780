<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TACN — Ôn tập Tiếng Anh Chuyên Ngành</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface2: #243044;
      --border: #2d3f56;
      --text: #e8edf4;
      --text-muted: #8b9cb3;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }
    .app { display: flex; min-height: 100vh; }
    
    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
      transition: transform .3s;
    }
    .sidebar-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -.02em;
    }
    .sidebar-header p { font-size: .8rem; color: var(--text-muted); margin-top: .25rem; }
    .nav-list { flex: 1; overflow-y: auto; padding: .75rem; }
    .nav-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: .6rem .85rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: .85rem;
      color: var(--text-muted);
      transition: all .15s;
      margin-bottom: 2px;
    }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: var(--accent); color: #fff; }
    .nav-item .count {
      font-size: .7rem;
      background: rgba(255,255,255,.12);
      padding: .1rem .45rem;
      border-radius: 10px;
    }
    .nav-item.active .count { background: rgba(255,255,255,.25); }

    /* Main */
    .main { flex: 1; margin-left: 280px; display: flex; flex-direction: column; }
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: rgba(15,20,25,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex; align-items: center; gap: 1rem;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1; min-width: 200px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: .65rem 1rem .65rem 2.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: .9rem;
      outline: none;
      transition: border-color .2s;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box svg {
      position: absolute; left: .75rem; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }
    .mode-tabs {
      display: flex; gap: .35rem;
      background: var(--surface);
      padding: .25rem;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .mode-tab {
      padding: .45rem .9rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: .8rem;
      font-weight: 500;
      border-radius: 7px;
      cursor: pointer;
      transition: all .15s;
      font-family: inherit;
    }
    .mode-tab:hover { color: var(--text); }
    .mode-tab.active { background: var(--accent); color: #fff; }
    .menu-toggle {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: .5rem;
      border-radius: 8px;
      cursor: pointer;
    }

    .content { padding: 1.5rem; flex: 1; }
    .stats-bar {
      display: flex; gap: 1rem; flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      min-width: 120px;
    }
    .stat-card .num { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
    .stat-card .label { font-size: .75rem; color: var(--text-muted); }

    /* Section header */
    .section-header {
      margin-bottom: 1.25rem;
      padding-bottom: .75rem;
      border-bottom: 1px solid var(--border);
    }
    .section-header h2 { font-size: 1.25rem; font-weight: 600; }
    .section-header .note { font-size: .85rem; color: var(--text-muted); margin-top: .25rem; }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: .75rem;
      transition: border-color .2s;
    }
    .card:hover { border-color: #3d5270; }
    .card-num {
      display: inline-block;
      background: var(--surface2);
      color: var(--accent);
      font-size: .7rem;
      font-weight: 600;
      padding: .15rem .5rem;
      border-radius: 4px;
      margin-bottom: .5rem;
    }
    .card-question { font-size: .95rem; margin-bottom: .75rem; }
    .card-note {
      font-size: .8rem;
      color: var(--warning);
      margin-bottom: .5rem;
      font-style: italic;
    }
    .options { display: flex; flex-direction: column; gap: .4rem; }
    .option {
      display: flex; align-items: flex-start; gap: .6rem;
      padding: .55rem .75rem;
      background: var(--surface2);
      border-radius: 8px;
      font-size: .875rem;
      cursor: pointer;
      transition: all .15s;
      border: 1px solid transparent;
    }
    .option:hover { border-color: var(--border); }
    .option .key {
      font-weight: 600;
      color: var(--accent);
      min-width: 1.2rem;
      font-family: 'JetBrains Mono', monospace;
    }
    .option.revealed-correct { border-color: var(--success); background: rgba(34,197,94,.1); }
    .option.revealed-wrong { opacity: .5; }
    .reveal-btn {
      margin-top: .75rem;
      padding: .4rem .85rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      font-size: .8rem;
      cursor: pointer;
      font-family: inherit;
    }
    .reveal-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Translation */
    .translation-card .en { font-size: .95rem; margin-bottom: .6rem; }
    .translation-card .vi {
      font-size: .875rem;
      color: var(--success);
      padding: .6rem .85rem;
      background: rgba(34,197,94,.08);
      border-radius: 8px;
      border-left: 3px solid var(--success);
      display: none;
    }
    .translation-card.revealed .vi { display: block; }

    /* True/False */
    .tf-card { display: flex; align-items: flex-start; gap: 1rem; }
    .tf-btns { display: flex; gap: .4rem; flex-shrink: 0; }
    .tf-btn {
      padding: .35rem .75rem;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-muted);
      border-radius: 6px;
      font-size: .8rem;
      cursor: pointer;
      font-family: inherit;
    }
    .tf-btn:hover { border-color: var(--accent); }
    .tf-btn.correct { background: var(--success); border-color: var(--success); color: #fff; }
    .tf-btn.wrong { background: var(--danger); border-color: var(--danger); color: #fff; }

    /* Fill blank */
    .fill-text {
      font-size: .9rem;
      line-height: 1.8;
      font-family: 'JetBrains Mono', monospace;
    }
    .fill-text .blank {
      color: var(--accent);
      border-bottom: 2px dashed var(--accent);
      padding: 0 .25rem;
    }

    /* Note */
    .note-card {
      font-size: .85rem;
      color: var(--text-muted);
      border-left: 3px solid var(--warning);
      padding-left: .85rem;
    }

    /* Flashcard mode */
    .flashcard-container {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 60vh; gap: 1.5rem;
    }
    .flashcard {
      width: 100%; max-width: 600px;
      min-height: 280px;
      perspective: 1000px;
      cursor: pointer;
    }
    .flashcard-inner {
      position: relative;
      width: 100%; min-height: 280px;
      transition: transform .5s;
      transform-style: preserve-3d;
    }
    .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
    .flashcard-front, .flashcard-back {
      position: absolute; width: 100%; min-height: 280px;
      backface-visibility: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .flashcard-back {
      transform: rotateY(180deg);
      background: var(--surface2);
    }
    .flashcard-front p, .flashcard-back p { font-size: 1.05rem; line-height: 1.7; }
    .flashcard-label {
      font-size: .75rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .flashcard-hint { font-size: .8rem; color: var(--text-muted); margin-top: 1rem; }
    .flashcard-nav {
      display: flex; align-items: center; gap: 1rem;
    }
    .flashcard-nav button {
      padding: .6rem 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: .875rem;
    }
    .flashcard-nav button:hover { border-color: var(--accent); }
    .flashcard-nav button.primary { background: var(--accent); border-color: var(--accent); }
    .flashcard-progress { font-size: .85rem; color: var(--text-muted); }

    /* Quiz mode */
    .quiz-container { max-width: 700px; margin: 0 auto; }
    .quiz-score {
      text-align: center;
      padding: 2rem;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .quiz-score h3 { font-size: 1.5rem; margin-bottom: .5rem; }
    .quiz-progress {
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    .quiz-progress-bar {
      height: 100%;
      background: var(--accent);
      transition: width .3s;
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }
    .part-header {
      font-size: .9rem;
      font-weight: 600;
      color: var(--accent);
      margin: 1.25rem 0 .75rem;
      padding: .5rem 0;
      border-bottom: 1px dashed var(--border);
    }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; }
      .menu-toggle { display: block; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>📚 TACN Ôn Tập</h1>
        <p>Tiếng Anh Chuyên Ngành Tin học</p>
      </div>
      <nav class="nav-list" id="navList"></nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="search" id="searchInput" placeholder="Tìm kiếm từ vựng, câu hỏi...">
        </div>
        <div class="mode-tabs">
          <button class="mode-tab active" data-mode="browse">📖 Xem</button>
          <button class="mode-tab" data-mode="flashcard">🃏 Flashcard</button>
          <button class="mode-tab" data-mode="quiz">✅ Quiz</button>
        </div>
      </header>

      <div class="content" id="content">
        <div class="stats-bar" id="statsBar"></div>
        <div id="mainContent"></div>
      </div>
    </div>
  </div>

  <script>
    let DATA = null;
    let currentSection = 'all';
    let currentMode = 'browse';
    let searchQuery = '';
    let flashcardIndex = 0;
    let flashcardDeck = [];
    let quizState = null;

    async function loadData() {
      const res = await fetch('data.json');
      DATA = await res.json();
      init();
    }

    function init() {
      renderNav();
      renderStats();
      renderContent();
      bindEvents();
    }

    function bindEvents() {
      document.getElementById('searchInput').addEventListener('input', e => {
        searchQuery = e.target.value.toLowerCase();
        renderContent();
      });
      document.querySelectorAll('.mode-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          currentMode = tab.dataset.mode;
          flashcardIndex = 0;
          quizState = null;
          renderContent();
        });
      });
      document.getElementById('menuToggle').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('open');
      });
    }

    function renderNav() {
      const nav = document.getElementById('navList');
      const total = DATA.sections.reduce((s, sec) => s + sec.items.length, 0);
      let html = `<div class="nav-item ${currentSection === 'all' ? 'active' : ''}" data-section="all">
        <span>Tất cả</span><span class="count">${total}</span>
      </div>`;
      DATA.sections.forEach(sec => {
        if (sec.items.length === 0) return;
        html += `<div class="nav-item ${currentSection === sec.id ? 'active' : ''}" data-section="${sec.id}">
          <span>${sec.title}</span><span class="count">${sec.items.length}</span>
        </div>`;
      });
      nav.innerHTML = html;
      nav.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => {
          currentSection = item.dataset.section === 'all' ? 'all' : parseInt(item.dataset.section);
          document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
          item.classList.add('active');
          document.getElementById('sidebar').classList.remove('open');
          flashcardIndex = 0;
          quizState = null;
          renderContent();
        });
      });
    }

    function renderStats() {
      const s = DATA.stats;
      document.getElementById('statsBar').innerHTML = `
        <div class="stat-card"><div class="num">${s.mcq}</div><div class="label">Trắc nghiệm</div></div>
        <div class="stat-card"><div class="num">${s.translation}</div><div class="label">Dịch câu</div></div>
        <div class="stat-card"><div class="num">${s.true_false}</div><div class="label">Đúng/Sai</div></div>
        <div class="stat-card"><div class="num">${s.fill_blank}</div><div class="label">Điền khuyết</div></div>
        <div class="stat-card"><div class="num">${s.sections}</div><div class="label">Chủ đề</div></div>
      `;
    }

    function getFilteredSections() {
      let sections = currentSection === 'all'
        ? DATA.sections
        : DATA.sections.filter(s => s.id === currentSection);

      if (!searchQuery) return sections.filter(s => s.items.length > 0);

      return sections.map(sec => ({
        ...sec,
        items: sec.items.filter(item => matchesSearch(item))
      })).filter(s => s.items.length > 0);
    }

    function matchesSearch(item) {
      const text = JSON.stringify(item).toLowerCase();
      return text.includes(searchQuery);
    }

    function renderContent() {
      const main = document.getElementById('mainContent');
      if (currentMode === 'flashcard') {
        main.innerHTML = renderFlashcardMode();
        bindFlashcardEvents();
        return;
      }
      if (currentMode === 'quiz') {
        main.innerHTML = renderQuizMode();
        bindQuizEvents();
        return;
      }
      const sections = getFilteredSections();
      if (sections.length === 0) {
        main.innerHTML = '<div class="empty-state"><p>Không tìm thấy kết quả phù hợp.</p></div>';
        return;
      }
      main.innerHTML = sections.map(sec => renderSection(sec)).join('');
      bindCardEvents();
    }

    function renderSection(sec) {
      let html = `<div class="section-header">
        <h2>${sec.title}</h2>
        ${sec.note ? `<p class="note">${sec.note}</p>` : ''}
      </div>`;
      sec.items.forEach((item, idx) => {
        html += renderItem(item, sec.title, idx);
      });
      return html;
    }

    function renderItem(item, sectionTitle, idx) {
      switch (item.type) {
        case 'part_header':
          return `<div class="part-header">${item.title}</div>`;
        case 'mcq':
          return renderMCQ(item, idx);
        case 'translation':
          return renderTranslation(item, idx);
        case 'true_false':
          return renderTF(item, idx);
        case 'fill_blank':
          return renderFillBlank(item);
        case 'passage':
          return `<div class="card"><p class="card-question">${escapeHtml(item.text)}</p></div>`;
        case 'note':
          return `<div class="card note-card">${escapeHtml(item.text)}</div>`;
        case 'statement':
          return `<div class="card"><p class="card-question">${escapeHtml(item.text)}</p></div>`;
        case 'word_box':
          return `<div class="card"><p style="font-size:.8rem;color:var(--text-muted);margin-bottom:.5rem">Từ gợi ý:</p><div style="display:flex;flex-wrap:wrap;gap:.4rem">${item.words.map(w => `<span style="background:var(--surface2);padding:.25rem .6rem;border-radius:6px;font-size:.8rem">${escapeHtml(w)}</span>`).join('')}</div></div>`;
        case 'collocation_word':
          return `<div class="card"><span class="card-num">${item.num}</span><p class="card-question">${escapeHtml(item.word)}</p></div>`;
        case 'collocation_opt':
          return `<div class="option" style="margin-bottom:.3rem"><span class="key">${item.key}.</span><span>${escapeHtml(item.text)}</span></div>`;
        case 'collocation_ans':
          return `<div class="card" style="padding:.6rem 1rem"><span class="card-num">${item.num}</span> → <strong style="color:var(--success)">${escapeHtml(item.answer)}</strong></div>`;
        default:
          return '';
      }
    }

    function renderMCQ(item, idx) {
      const opts = (item.options || []).map(o =>
        `<div class="option" data-idx="${idx}"><span class="key">${o.key}.</span><span>${escapeHtml(o.text)}</span></div>`
      ).join('');
      return `<div class="card mcq-card" data-idx="${idx}">
        ${item.num ? `<span class="card-num">Câu ${item.num}</span>` : ''}
        ${item.note ? `<p class="card-note">💡 ${escapeHtml(item.note)}</p>` : ''}
        <p class="card-question">${escapeHtml(item.question)}</p>
        ${opts ? `<div class="options">${opts}</div>` : ''}
        ${item.note && !opts.length ? '' : `<button class="reveal-btn" data-reveal="${idx}">Hiện gợi ý</button>`}
      </div>`;
    }

    function renderTranslation(item, idx) {
      return `<div class="card translation-card" data-tidx="${idx}">
        <span class="card-num">Dịch</span>
        <p class="en">${escapeHtml(item.english)}</p>
        <div class="vi">${escapeHtml(item.vietnamese || 'Chưa có bản dịch')}</div>
        <button class="reveal-btn" data-trans="${idx}">Hiện bản dịch</button>
      </div>`;
    }

    function renderTF(item, idx) {
      return `<div class="card tf-card" data-tfidx="${idx}" data-answer="${item.answer || ''}">
        <p class="card-question" style="flex:1">${escapeHtml(item.statement)}</p>
        <div class="tf-btns">
          <button class="tf-btn" data-tf="T">Đúng</button>
          <button class="tf-btn" data-tf="F">Sai</button>
        </div>
      </div>`;
    }

    function renderFillBlank(item) {
      const text = escapeHtml(item.text)
        .replace(/…+/g, '<span class="blank">___</span>')
        .replace(/_{2,}/g, '<span class="blank">___</span>');
      return `<div class="card"><p class="fill-text">${text}</p></div>`;
    }

    function bindCardEvents() {
      document.querySelectorAll('[data-trans]').forEach(btn => {
        btn.addEventListener('click', () => {
          btn.closest('.translation-card').classList.add('revealed');
          btn.style.display = 'none';
        });
      });
      document.querySelectorAll('[data-reveal]').forEach(btn => {
        btn.addEventListener('click', () => {
          const card = btn.closest('.mcq-card');
          const note = card.querySelector('.card-note');
          if (note) note.style.display = 'block';
          btn.textContent = 'Đã hiện gợi ý';
        });
      });
      document.querySelectorAll('.tf-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const card = btn.closest('.tf-card');
          const answer = card.dataset.answer;
          if (!answer) { btn.classList.add('correct'); return; }
          const chosen = btn.dataset.tf;
          card.querySelectorAll('.tf-btn').forEach(b => {
            if (b.dataset.tf === answer) b.classList.add('correct');
            else if (b === btn && chosen !== answer) b.classList.add('wrong');
          });
        });
      });
    }

    function buildFlashcardDeck() {
      const deck = [];
      const sections = getFilteredSections();
      sections.forEach(sec => {
        sec.items.forEach(item => {
          if (item.type === 'translation' && item.vietnamese) {
            deck.push({ front: item.english, back: item.vietnamese, section: sec.title });
          } else if (item.type === 'true_false' && item.answer) {
            deck.push({
              front: item.statement,
              back: item.answer === 'T' ? '✅ ĐÚNG (True)' : '❌ SAI (False)',
              section: sec.title
            });
          } else if (item.type === 'mcq' && item.options.length > 0) {
            const hint = item.note ? `\n💡 ${item.note}` : '';
            deck.push({
              front: item.question,
              back: item.options.map(o => `${o.key}. ${o.text}`).join('\n') + hint,
              section: sec.title
            });
          }
        });
      });
      return shuffle(deck);
    }

    function renderFlashcardMode() {
      flashcardDeck = buildFlashcardDeck();
      if (flashcardDeck.length === 0) {
        return '<div class="empty-state"><p>Không có flashcard cho phần này.</p></div>';
      }
      const card = flashcardDeck[flashcardIndex];
      return `<div class="flashcard-container">
        <div class="flashcard-progress">${flashcardIndex + 1} / ${flashcardDeck.length} — ${card.section}</div>
        <div class="flashcard" id="flashcard">
          <div class="flashcard-inner">
            <div class="flashcard-front">
              <div class="flashcard-label">Tiếng Anh</div>
              <p>${escapeHtml(card.front)}</p>
              <div class="flashcard-hint">Nhấn để lật thẻ</div>
            </div>
            <div class="flashcard-back">
              <div class="flashcard-label">Tiếng Việt / Đáp án</div>
              <p style="white-space:pre-line">${escapeHtml(card.back)}</p>
            </div>
          </div>
        </div>
        <div class="flashcard-nav">
          <button id="fcPrev">← Trước</button>
          <button id="fcShuffle" class="primary">🔀 Xáo trộn</button>
          <button id="fcNext">Sau →</button>
        </div>
      </div>`;
    }

    function bindFlashcardEvents() {
      const fc = document.getElementById('flashcard');
      if (fc) fc.addEventListener('click', () => fc.classList.toggle('flipped'));
      document.getElementById('fcPrev')?.addEventListener('click', () => {
        flashcardIndex = (flashcardIndex - 1 + flashcardDeck.length) % flashcardDeck.length;
        renderContent();
      });
      document.getElementById('fcNext')?.addEventListener('click', () => {
        flashcardIndex = (flashcardIndex + 1) % flashcardDeck.length;
        renderContent();
      });
      document.getElementById('fcShuffle')?.addEventListener('click', () => {
        flashcardDeck = shuffle(flashcardDeck);
        flashcardIndex = 0;
        renderContent();
      });
    }

    function buildQuizQuestions() {
      const questions = [];
      const sections = getFilteredSections();
      sections.forEach(sec => {
        sec.items.forEach(item => {
          if (item.type === 'true_false' && item.answer) {
            questions.push({ type: 'tf', statement: item.statement, answer: item.answer });
          } else if (item.type === 'mcq' && item.options.length >= 2 && item.note) {
            const correctKey = item.note.split(/[,\s=]/)[0].trim().toLowerCase().charAt(0);
            if (/^[a-d]$/.test(correctKey)) {
              questions.push({ type: 'mcq', question: item.question, options: item.options, answer: correctKey });
            }
          }
        });
      });
      return shuffle(questions).slice(0, 20);
    }

    function renderQuizMode() {
      if (!quizState) {
        const qs = buildQuizQuestions();
        if (qs.length === 0) {
          return '<div class="empty-state"><p>Không đủ câu hỏi quiz cho phần này. Hãy chọn "Tất cả" hoặc phần có đáp án.</p><button class="reveal-btn" id="startQuiz" style="margin-top:1rem">Bắt đầu với tất cả</button></div>';
        }
        quizState = { questions: qs, current: 0, score: 0, answered: false };
      }

      if (quizState.current >= quizState.questions.length) {
        const pct = Math.round(quizState.score / quizState.questions.length * 100);
        return `<div class="quiz-container"><div class="quiz-score">
          <h3>🎉 Hoàn thành!</h3>
          <p style="font-size:2rem;font-weight:700;color:var(--accent);margin:1rem 0">${quizState.score}/${quizState.questions.length}</p>
          <p style="color:var(--text-muted)">Điểm: ${pct}%</p>
          <button class="reveal-btn" id="restartQuiz" style="margin-top:1.5rem">Làm lại</button>
        </div></div>`;
      }

      const q = quizState.questions[quizState.current];
      const progress = (quizState.current / quizState.questions.length) * 100;

      if (q.type === 'tf') {
        return `<div class="quiz-container">
          <div class="quiz-progress"><div class="quiz-progress-bar" style="width:${progress}%"></div></div>
          <p style="color:var(--text-muted);font-size:.85rem;margin-bottom:1rem">Câu ${quizState.current + 1}/${quizState.questions.length}</p>
          <div class="card">
            <p class="card-question" style="font-size:1.05rem">${escapeHtml(q.statement)}</p>
            <div class="tf-btns" style="margin-top:1rem">
              <button class="tf-btn quiz-answer" data-ans="T" style="padding:.75rem 2rem">Đúng</button>
              <button class="tf-btn quiz-answer" data-ans="F" style="padding:.75rem 2rem">Sai</button>
            </div>
          </div>
        </div>`;
      }

      const opts = q.options.map(o =>
        `<div class="option quiz-answer" data-ans="${o.key}"><span class="key">${o.key}.</span><span>${escapeHtml(o.text)}</span></div>`
      ).join('');

      return `<div class="quiz-container">
        <div class="quiz-progress"><div class="quiz-progress-bar" style="width:${progress}%"></div></div>
        <p style="color:var(--text-muted);font-size:.85rem;margin-bottom:1rem">Câu ${quizState.current + 1}/${quizState.questions.length}</p>
        <div class="card">
          <p class="card-question" style="font-size:1.05rem">${escapeHtml(q.question)}</p>
          <div class="options" style="margin-top:1rem">${opts}</div>
        </div>
      </div>`;
    }

    function bindQuizEvents() {
      document.getElementById('restartQuiz')?.addEventListener('click', () => {
        quizState = null;
        renderContent();
      });
      document.getElementById('startQuiz')?.addEventListener('click', () => {
        currentSection = 'all';
        quizState = null;
        renderNav();
        renderContent();
      });
      document.querySelectorAll('.quiz-answer').forEach(btn => {
        btn.addEventListener('click', () => {
          if (quizState.answered) return;
          const q = quizState.questions[quizState.current];
          const chosen = btn.dataset.ans;
          const correct = q.answer;
          if (chosen === correct) {
            quizState.score++;
            btn.classList.add('revealed-correct');
          } else {
            btn.classList.add('revealed-wrong');
            document.querySelectorAll('.quiz-answer').forEach(b => {
              if (b.dataset.ans === correct) b.classList.add('revealed-correct');
            });
          }
          quizState.answered = true;
          setTimeout(() => {
            quizState.current++;
            quizState.answered = false;
            renderContent();
          }, 1200);
        });
      });
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    loadData();
  </script>
</body>
</html>
