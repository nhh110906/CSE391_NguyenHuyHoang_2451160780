<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TACN — Ôn tập Tiếng Anh Chuyên Ngành</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface2: #243044;
      --border: #2d3f56;
      --text: #e8edf4;
      --text-muted: #8b9cb3;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }
    .app { display: flex; min-height: 100vh; }
    
    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
      transition: transform .3s;
    }
    .sidebar-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -.02em;
    }
    .sidebar-header p { font-size: .8rem; color: var(--text-muted); margin-top: .25rem; }
    .nav-list { flex: 1; overflow-y: auto; padding: .75rem; }
    .nav-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: .6rem .85rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: .85rem;
      color: var(--text-muted);
      transition: all .15s;
      margin-bottom: 2px;
    }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: var(--accent); color: #fff; }
    .nav-item .count {
      font-size: .7rem;
      background: rgba(255,255,255,.12);
      padding: .1rem .45rem;
      border-radius: 10px;
    }
    .nav-item.active .count { background: rgba(255,255,255,.25); }

    /* Main */
    .main { flex: 1; margin-left: 280px; display: flex; flex-direction: column; }
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: rgba(15,20,25,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex; align-items: center; gap: 1rem;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1; min-width: 200px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: .65rem 1rem .65rem 2.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: .9rem;
      outline: none;
      transition: border-color .2s;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box svg {
      position: absolute; left: .75rem; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }
    .mode-tabs {
      display: flex; gap: .35rem;
      background: var(--surface);
      padding: .25rem;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .mode-tab {
      padding: .45rem .9rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: .8rem;
      font-weight: 500;
      border-radius: 7px;
      cursor: pointer;
      transition: all .15s;
      font-family: inherit;
    }
    .mode-tab:hover { color: var(--text); }
    .mode-tab.active { background: var(--accent); color: #fff; }
    .menu-toggle {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: .5rem;
      border-radius: 8px;
      cursor: pointer;
    }

    .content { padding: 1.5rem; flex: 1; }
    .stats-bar {
      display: flex; gap: 1rem; flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      min-width: 120px;
    }
    .stat-card .num { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
    .stat-card .label { font-size: .75rem; color: var(--text-muted); }

    /* Section header */
    .section-header {
      margin-bottom: 1.25rem;
      padding-bottom: .75rem;
      border-bottom: 1px solid var(--border);
    }
    .section-header h2 { font-size: 1.25rem; font-weight: 600; }
    .section-header .note { font-size: .85rem; color: var(--text-muted); margin-top: .25rem; }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: .75rem;
      transition: border-color .2s;
    }
    .card:hover { border-color: #3d5270; }
    .card-num {
      display: inline-block;
      background: var(--surface2);
      color: var(--accent);
      font-size: .7rem;
      font-weight: 600;
      padding: .15rem .5rem;
      border-radius: 4px;
      margin-bottom: .5rem;
    }
    .card-question { font-size: .95rem; margin-bottom: .75rem; }
    .card-note {
      font-size: .8rem;
      color: var(--warning);
      margin-bottom: .5rem;
      font-style: italic;
    }
    .options { display: flex; flex-direction: column; gap: .4rem; }
    .option {
      display: flex; align-items: flex-start; gap: .6rem;
      padding: .55rem .75rem;
      background: var(--surface2);
      border-radius: 8px;
      font-size: .875rem;
      cursor: pointer;
      transition: all .15s;
      border: 1px solid transparent;
    }
    .option:hover { border-color: var(--border); }
    .option .key {
      font-weight: 600;
      color: var(--accent);
      min-width: 1.2rem;
      font-family: 'JetBrains Mono', monospace;
    }
    .option.revealed-correct { border-color: var(--success); background: rgba(34,197,94,.1); }
    .option.revealed-wrong { opacity: .5; }
    .answer-panel {
      margin-top: .75rem;
      padding: .6rem .85rem;
      background: rgba(34,197,94,.08);
      border-radius: 8px;
      border-left: 3px solid var(--success);
      font-size: .875rem;
      color: var(--success);
      display: none;
    }
    .card.revealed .answer-panel,
    .card.revealed .vi { display: block; }
    .answer-panel strong { color: var(--text); }
    .toggle-answers-btn {
      padding: .45rem .9rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: .8rem;
      font-weight: 500;
      border-radius: 7px;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .toggle-answers-btn:hover,
    .toggle-answers-btn.active { border-color: var(--accent); color: var(--accent); }
    .toggle-answers-btn.active { background: rgba(59,130,246,.12); }
    .reveal-btn {
      margin-top: .75rem;
      padding: .4rem .85rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      font-size: .8rem;
      cursor: pointer;
      font-family: inherit;
    }
    .reveal-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Translation */
    .translation-card .en { font-size: .95rem; margin-bottom: .6rem; }
    .translation-card .vi {
      font-size: .875rem;
      color: var(--success);
      padding: .6rem .85rem;
      background: rgba(34,197,94,.08);
      border-radius: 8px;
      border-left: 3px solid var(--success);
      display: none;
    }
    .translation-card.revealed .vi { display: block; }

    /* True/False */
    .tf-card { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 1rem; }
    .tf-card .reveal-btn { flex-basis: 100%; margin-top: 0; }
    .tf-btns { display: flex; gap: .4rem; flex-shrink: 0; }
    .tf-btn {
      padding: .35rem .75rem;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-muted);
      border-radius: 6px;
      font-size: .8rem;
      cursor: pointer;
      font-family: inherit;
    }
    .tf-btn:hover { border-color: var(--accent); }
    .tf-btn.correct { background: var(--success); border-color: var(--success); color: #fff; }
    .tf-btn.wrong { background: var(--danger); border-color: var(--danger); color: #fff; }

    /* Fill blank */
    .fill-text {
      font-size: .9rem;
      line-height: 1.8;
      font-family: 'JetBrains Mono', monospace;
    }
    .fill-text .blank {
      color: var(--accent);
      border-bottom: 2px dashed var(--accent);
      padding: 0 .25rem;
    }

    /* Note */
    .note-card {
      font-size: .85rem;
      color: var(--text-muted);
      border-left: 3px solid var(--warning);
      padding-left: .85rem;
    }

    /* Flashcard mode */
    .flashcard-container {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 60vh; gap: 1.5rem;
    }
    .flashcard {
      width: 100%; max-width: 600px;
      min-height: 280px;
      perspective: 1000px;
      cursor: pointer;
    }
    .flashcard-inner {
      position: relative;
      width: 100%; min-height: 280px;
      transition: transform .5s;
      transform-style: preserve-3d;
    }
    .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
    .flashcard-front, .flashcard-back {
      position: absolute; width: 100%; min-height: 280px;
      backface-visibility: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .flashcard-back {
      transform: rotateY(180deg);
      background: var(--surface2);
    }
    .flashcard-front p, .flashcard-back p { font-size: 1.05rem; line-height: 1.7; }
    .flashcard-label {
      font-size: .75rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .flashcard-hint { font-size: .8rem; color: var(--text-muted); margin-top: 1rem; }
    .flashcard-nav {
      display: flex; align-items: center; gap: 1rem;
    }
    .flashcard-nav button {
      padding: .6rem 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: .875rem;
    }
    .flashcard-nav button:hover { border-color: var(--accent); }
    .flashcard-nav button.primary { background: var(--accent); border-color: var(--accent); }
    .flashcard-progress { font-size: .85rem; color: var(--text-muted); }

    /* Quiz mode */
    .quiz-container { max-width: 700px; margin: 0 auto; }
    .quiz-score {
      text-align: center;
      padding: 2rem;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .quiz-score h3 { font-size: 1.5rem; margin-bottom: .5rem; }
    .quiz-progress {
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    .quiz-progress-bar {
      height: 100%;
      background: var(--accent);
      transition: width .3s;
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }
    .part-header {
      font-size: .9rem;
      font-weight: 600;
      color: var(--accent);
      margin: 1.25rem 0 .75rem;
      padding: .5rem 0;
      border-bottom: 1px dashed var(--border);
    }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; }
      .menu-toggle { display: block; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>📚 TACN Ôn Tập</h1>
        <p>Tiếng Anh Chuyên Ngành Tin học</p>
      </div>
      <nav class="nav-list" id="navList"></nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="search" id="searchInput" placeholder="Tìm kiếm từ vựng, câu hỏi...">
        </div>
        <button class="toggle-answers-btn" id="toggleAnswers" type="button">Hiện đáp án</button>
        <div class="mode-tabs">
          <button class="mode-tab active" data-mode="browse">📖 Xem</button>
          <button class="mode-tab" data-mode="flashcard">🃏 Flashcard</button>
          <button class="mode-tab" data-mode="quiz">✅ Quiz</button>
        </div>
      </header>

      <div class="content" id="content">
        <div class="stats-bar" id="statsBar"></div>
        <div id="mainContent"></div>
      </div>
    </div>
  </div>

  <script>
    let DATA = null;
    let currentSection = 'all';
    let currentMode = 'browse';
    let searchQuery = '';
    let flashcardIndex = 0;
    let flashcardDeck = [];
    let quizState = null;
    let showAnswers = false;

    async function loadData() {
      const res = await fetch('data.json');
      DATA = await res.json();
      init();
    }

    function init() {
      renderNav();
      renderStats();
      renderContent();
      bindEvents();
    }

    function bindEvents() {
      document.getElementById('searchInput').addEventListener('input', e => {
        searchQuery = e.target.value.toLowerCase();
        renderContent();
      });
      document.querySelectorAll('.mode-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          currentMode = tab.dataset.mode;
          flashcardIndex = 0;
          quizState = null;
          renderContent();
        });
      });
      document.getElementById('menuToggle').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('open');
      });
      document.getElementById('toggleAnswers').addEventListener('click', () => {
        showAnswers = !showAnswers;
        const btn = document.getElementById('toggleAnswers');
        btn.textContent = showAnswers ? 'Ẩn đáp án' : 'Hiện đáp án';
        btn.classList.toggle('active', showAnswers);
        renderContent();
      });
    }

    function getMcqAnswer(item) {
      if (item.answer) {
        const opt = (item.options || []).find(o => o.key === item.answer);
        const text = item.answer_text || (opt ? opt.text.split('=')[0].trim() : '');
        return { key: item.answer, text };
      }
      const note = (item.note || '').trim();
      if (/^[a-d]$/i.test(note)) {
        const key = note.toLowerCase();
        const opt = (item.options || []).find(o => o.key === key);
        return { key, text: opt ? opt.text.split('=')[0].trim() : '' };
      }
      if (note) return { text: note };
      for (const o of (item.options || [])) {
        if (o.text.includes('=')) {
          return { key: o.key, text: o.text.split('=')[0].trim() };
        }
      }
      const embedded = (item.question || '').match(/_{2,}\s*([A-Za-z][\w\s-]*)\s*$/);
      if (embedded) return { text: embedded[1].trim() };
      return null;
    }

    function getFillAnswer(item) {
      if (item.answer) return item.answer;
      const text = item.text || '';
      const underscore = text.match(/_{1,}([^_\s][^_]*?)[_\s]{1,}/);
      if (underscore) return underscore[1].trim();
      const letter = text.match(/^\d+\s*[.…]+\s*([a-z])\s*$/i);
      if (letter) return letter[1].toLowerCase();
      return null;
    }

    function getCollocationAnswer(wordItem, optsByNum, ansByNum) {
      if (wordItem.answer) {
        const key = String(wordItem.answer).toLowerCase();
        const opt = (optsByNum[wordItem.num] || optsByNum._shared || []).find(o => o.key === key);
        return { key, text: opt ? opt.text : key };
      }
      const ans = ansByNum[wordItem.num];
      if (ans) {
        const key = String(ans.answer || ans).toLowerCase();
        const opt = (optsByNum[wordItem.num] || optsByNum._shared || []).find(o => o.key === key);
        return { key, text: opt ? opt.text : key };
      }
      return null;
    }

    function formatAnswerLabel(ans) {
      if (!ans) return '';
      if (ans.key && ans.text) return `${ans.key.toUpperCase()}. ${ans.text}`;
      if (ans.key) return ans.key.toUpperCase();
      return ans.text || '';
    }

    function renderAnswerPanel(html, revealed) {
      if (!html) return '';
      return `<div class="answer-panel" style="display:${revealed ? 'block' : 'none'}">Đáp án: <strong>${html}</strong></div>`;
    }

    function isRevealed(force) {
      return showAnswers || !!force;
    }

    function renderNav() {
      const nav = document.getElementById('navList');
      const total = DATA.sections.reduce((s, sec) => s + sec.items.length, 0);
      let html = `<div class="nav-item ${currentSection === 'all' ? 'active' : ''}" data-section="all">
        <span>Tất cả</span><span class="count">${total}</span>
      </div>`;
      DATA.sections.forEach(sec => {
        if (sec.items.length === 0) return;
        html += `<div class="nav-item ${currentSection === sec.id ? 'active' : ''}" data-section="${sec.id}">
          <span>${sec.title}</span><span class="count">${sec.items.length}</span>
        </div>`;
      });
      nav.innerHTML = html;
      nav.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => {
          currentSection = item.dataset.section === 'all' ? 'all' : parseInt(item.dataset.section);
          document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
          item.classList.add('active');
          document.getElementById('sidebar').classList.remove('open');
          flashcardIndex = 0;
          quizState = null;
          renderContent();
        });
      });
    }

    function renderStats() {
      const s = DATA.stats;
      document.getElementById('statsBar').innerHTML = `
        <div class="stat-card"><div class="num">${s.mcq}</div><div class="label">Trắc nghiệm</div></div>
        <div class="stat-card"><div class="num">${s.translation}</div><div class="label">Dịch câu</div></div>
        <div class="stat-card"><div class="num">${s.true_false}</div><div class="label">Đúng/Sai</div></div>
        <div class="stat-card"><div class="num">${s.fill_blank}</div><div class="label">Điền khuyết</div></div>
        <div class="stat-card"><div class="num">${s.sections}</div><div class="label">Chủ đề</div></div>
      `;
    }

    function getFilteredSections() {
      let sections = currentSection === 'all'
        ? DATA.sections
        : DATA.sections.filter(s => s.id === currentSection);

      if (!searchQuery) return sections.filter(s => s.items.length > 0);

      return sections.map(sec => ({
        ...sec,
        items: sec.items.filter(item => matchesSearch(item))
      })).filter(s => s.items.length > 0);
    }

    function matchesSearch(item) {
      const text = JSON.stringify(item).toLowerCase();
      return text.includes(searchQuery);
    }

    function renderContent() {
      const main = document.getElementById('mainContent');
      if (currentMode === 'flashcard') {
        main.innerHTML = renderFlashcardMode();
        bindFlashcardEvents();
        return;
      }
      if (currentMode === 'quiz') {
        main.innerHTML = renderQuizMode();
        bindQuizEvents();
        return;
      }
      const sections = getFilteredSections();
      if (sections.length === 0) {
        main.innerHTML = '<div class="empty-state"><p>Không tìm thấy kết quả phù hợp.</p></div>';
        return;
      }
      main.innerHTML = sections.map(sec => renderSection(sec)).join('');
      bindCardEvents();
    }

    function renderSection(sec) {
      let html = `<div class="section-header">
        <h2>${sec.title}</h2>
        ${sec.note ? `<p class="note">${sec.note}</p>` : ''}
      </div>`;

      const optsByNum = {};
      const ansByNum = {};
      const colWords = [];
      const normal = [];

      sec.items.forEach(item => {
        if (item.type === 'collocation_word') colWords.push(item);
        else if (item.type === 'collocation_opt') {
          const n = item.num || '_shared';
          (optsByNum[n] ||= []).push(item);
        } else if (item.type === 'collocation_ans') {
          ansByNum[item.num] = item;
        } else if (item.type !== 'collocation_opt' && item.type !== 'collocation_ans') {
          normal.push(item);
        }
      });

      normal.forEach((item, idx) => {
        html += renderItem(item, sec.title, idx);
      });

      if (colWords.length) {
        html += renderCollocationGroup(colWords, optsByNum, ansByNum);
      }

      return html;
    }

    function renderCollocationGroup(words, optsByNum, ansByNum) {
      const shared = optsByNum._shared || [];
      return words.map(word => {
        const opts = (optsByNum[word.num] || shared).map(o =>
          `<div class="option" data-coll-key="${o.key}"><span class="key">${o.key}.</span><span>${escapeHtml(o.text)}</span></div>`
        ).join('');
        const ans = getCollocationAnswer(word, optsByNum, ansByNum);
        const revealed = isRevealed();
        const correctKey = ans ? ans.key : '';
        const optsHtml = (optsByNum[word.num] || shared).map(o => {
          const classes = ['option'];
          if (revealed && correctKey && o.key === correctKey) classes.push('revealed-correct');
          return `<div class="${classes.join(' ')}"><span class="key">${o.key}.</span><span>${escapeHtml(o.text)}</span></div>`;
        }).join('');
        return `<div class="card collocation-card ${revealed ? 'revealed' : ''}" data-coll-ans="${correctKey}">
          <span class="card-num">${word.num}</span>
          <p class="card-question">${escapeHtml(word.word)}</p>
          ${optsHtml ? `<div class="options">${optsHtml}</div>` : ''}
          ${renderAnswerPanel(escapeHtml(formatAnswerLabel(ans)), revealed)}
          <button class="reveal-btn" data-reveal-coll>Hiện đáp án</button>
        </div>`;
      }).join('');
    }

    function renderItem(item, sectionTitle, idx) {
      switch (item.type) {
        case 'part_header':
          return `<div class="part-header">${item.title}</div>`;
        case 'mcq':
          return renderMCQ(item, idx);
        case 'translation':
          return renderTranslation(item, idx);
        case 'true_false':
          return renderTF(item, idx);
        case 'fill_blank':
          return renderFillBlank(item);
        case 'passage':
          return `<div class="card"><p class="card-question">${escapeHtml(item.text)}</p></div>`;
        case 'note':
          return `<div class="card note-card">${escapeHtml(item.text)}</div>`;
        case 'statement':
          return `<div class="card"><p class="card-question">${escapeHtml(item.text)}</p></div>`;
        case 'word_box':
          return `<div class="card"><p style="font-size:.8rem;color:var(--text-muted);margin-bottom:.5rem">Từ gợi ý:</p><div style="display:flex;flex-wrap:wrap;gap:.4rem">${item.words.map(w => `<span style="background:var(--surface2);padding:.25rem .6rem;border-radius:6px;font-size:.8rem">${escapeHtml(w)}</span>`).join('')}</div></div>`;
        case 'collocation_word':
        case 'collocation_opt':
        case 'collocation_ans':
          return '';
        default:
          return '';
      }
    }

    function renderMCQ(item, idx) {
      const ans = getMcqAnswer(item);
      const revealed = isRevealed();
      const correctKey = ans && ans.key ? ans.key : '';
      const opts = (item.options || []).map(o => {
        const classes = ['option'];
        if (revealed && correctKey && o.key === correctKey) classes.push('revealed-correct');
        return `<div class="${classes.join(' ')}" data-idx="${idx}" data-opt-key="${o.key}"><span class="key">${o.key}.</span><span>${escapeHtml(o.text.split('=')[0].trim())}</span></div>`;
      }).join('');
      const answerHtml = formatAnswerLabel(ans);
      return `<div class="card mcq-card ${revealed ? 'revealed' : ''}" data-idx="${idx}" data-correct="${correctKey}">
        ${item.num ? `<span class="card-num">Câu ${item.num}</span>` : ''}
        ${item.note && !ans ? `<p class="card-note">💡 ${escapeHtml(item.note)}</p>` : ''}
        <p class="card-question">${escapeHtml(item.question.replace(/_{2,}\s*[A-Za-z][\w\s-]*\s*$/, ' ___'))}</p>
        ${opts ? `<div class="options">${opts}</div>` : ''}
        ${renderAnswerPanel(escapeHtml(answerHtml), revealed && !!answerHtml)}
        ${answerHtml || (item.options || []).length ? `<button class="reveal-btn" data-reveal-mcq="${idx}">Hiện đáp án</button>` : ''}
      </div>`;
    }

    function renderTranslation(item, idx) {
      const revealed = isRevealed();
      return `<div class="card translation-card ${revealed ? 'revealed' : ''}" data-tidx="${idx}">
        <span class="card-num">Dịch</span>
        <p class="en">${escapeHtml(item.english)}</p>
        <div class="vi" style="display:${revealed ? 'block' : 'none'}">${escapeHtml(item.vietnamese || 'Chưa có bản dịch')}</div>
        <button class="reveal-btn" data-trans="${idx}">Hiện bản dịch</button>
      </div>`;
    }

    function renderTF(item, idx) {
      const ans = item.answer || '';
      const revealed = isRevealed();
      const label = ans === 'T' ? 'ĐÚNG (True)' : ans === 'F' ? 'SAI (False)' : '';
      return `<div class="card tf-card ${revealed ? 'revealed' : ''}" data-tfidx="${idx}" data-answer="${ans}">
        <div style="flex:1">
          <p class="card-question">${escapeHtml(item.statement)}</p>
          ${renderAnswerPanel(escapeHtml(label), revealed && !!label)}
        </div>
        <div class="tf-btns">
          <button class="tf-btn ${revealed && ans === 'T' ? 'correct' : ''}" data-tf="T">Đúng</button>
          <button class="tf-btn ${revealed && ans === 'F' ? 'correct' : ''}" data-tf="F">Sai</button>
        </div>
        <button class="reveal-btn" data-reveal-tf="${idx}" style="width:100%;margin-top:.5rem">Hiện đáp án</button>
      </div>`;
    }

    function renderFillBlank(item) {
      const ans = getFillAnswer(item);
      const revealed = isRevealed();
      const text = escapeHtml(item.text)
        .replace(/_{1,}([^_\s][^_]*?)[_\s]{1,}/g, '<span class="blank">___</span>')
        .replace(/…+/g, '<span class="blank">___</span>')
        .replace(/_{2,}/g, '<span class="blank">___</span>');
      const answerLabel = ans && ans.length === 1 && /[a-z]/i.test(ans)
        ? `Chọn: ${ans.toUpperCase()}`
        : ans;
      return `<div class="card fill-card ${revealed ? 'revealed' : ''}">
        <p class="fill-text">${text}</p>
        ${renderAnswerPanel(escapeHtml(answerLabel || ''), revealed && !!answerLabel)}
        <button class="reveal-btn" data-reveal-fill>Hiện đáp án</button>
      </div>`;
    }

    function bindCardEvents() {
      document.querySelectorAll('[data-trans]').forEach(btn => {
        btn.addEventListener('click', () => {
          const card = btn.closest('.translation-card');
          card.classList.add('revealed');
          card.querySelector('.vi').style.display = 'block';
          btn.style.display = 'none';
        });
      });
      document.querySelectorAll('[data-reveal-mcq]').forEach(btn => {
        btn.addEventListener('click', () => revealMcqCard(btn.closest('.mcq-card')));
      });
      document.querySelectorAll('[data-reveal-tf]').forEach(btn => {
        btn.addEventListener('click', () => revealTfCard(btn.closest('.tf-card')));
      });
      document.querySelectorAll('[data-reveal-fill]').forEach(btn => {
        btn.addEventListener('click', () => {
          const card = btn.closest('.fill-card');
          card.classList.add('revealed');
          card.querySelector('.answer-panel').style.display = 'block';
          btn.textContent = 'Đã hiện đáp án';
        });
      });
      document.querySelectorAll('[data-reveal-coll]').forEach(btn => {
        btn.addEventListener('click', () => {
          const card = btn.closest('.collocation-card');
          const key = card.dataset.collAns;
          card.classList.add('revealed');
          card.querySelectorAll('.option').forEach(o => {
            if (key && o.querySelector('.key').textContent.startsWith(key + '.')) {
              o.classList.add('revealed-correct');
            }
          });
          const panel = card.querySelector('.answer-panel');
          if (panel) panel.style.display = 'block';
          btn.textContent = 'Đã hiện đáp án';
        });
      });
      document.querySelectorAll('.tf-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const card = btn.closest('.tf-card');
          revealTfCard(card, btn.dataset.tf);
        });
      });
    }

    function revealMcqCard(card) {
      if (!card) return;
      const correctKey = card.dataset.correct;
      card.classList.add('revealed');
      card.querySelectorAll('.option').forEach(o => {
        if (correctKey && o.dataset.optKey === correctKey) o.classList.add('revealed-correct');
      });
      const panel = card.querySelector('.answer-panel');
      if (panel) panel.style.display = 'block';
      const btn = card.querySelector('[data-reveal-mcq]');
      if (btn) btn.textContent = 'Đã hiện đáp án';
    }

    function revealTfCard(card, chosen) {
      if (!card) return;
      const answer = card.dataset.answer;
      card.classList.add('revealed');
      card.querySelectorAll('.tf-btn').forEach(b => {
        b.classList.remove('correct', 'wrong');
        if (answer && b.dataset.tf === answer) b.classList.add('correct');
        else if (chosen && b.dataset.tf === chosen && chosen !== answer) b.classList.add('wrong');
      });
      const panel = card.querySelector('.answer-panel');
      if (panel) panel.style.display = 'block';
      const btn = card.querySelector('[data-reveal-tf]');
      if (btn) btn.textContent = 'Đã hiện đáp án';
    }

    function buildFlashcardDeck() {
      const deck = [];
      const sections = getFilteredSections();
      sections.forEach(sec => {
        const optsByNum = {};
        const ansByNum = {};
        sec.items.forEach(item => {
          if (item.type === 'collocation_opt') {
            const n = item.num || '_shared';
            (optsByNum[n] ||= []).push(item);
          } else if (item.type === 'collocation_ans') {
            ansByNum[item.num] = item;
          }
        });
        sec.items.forEach(item => {
          if (item.type === 'translation' && item.vietnamese) {
            deck.push({ front: item.english, back: item.vietnamese, section: sec.title });
          } else if (item.type === 'true_false' && item.answer) {
            deck.push({
              front: item.statement,
              back: item.answer === 'T' ? '✅ ĐÚNG (True)' : '❌ SAI (False)',
              section: sec.title
            });
          } else if (item.type === 'mcq') {
            const ans = getMcqAnswer(item);
            if (!ans) return;
            const label = formatAnswerLabel(ans);
            deck.push({
              front: item.question,
              back: label + (item.options || []).filter(o => !ans.key || o.key !== ans.key)
                .slice(0, 3).map(o => `\n${o.key}. ${o.text.split('=')[0].trim()}`).join(''),
              section: sec.title
            });
          } else if (item.type === 'fill_blank') {
            const ans = getFillAnswer(item);
            if (ans) {
              deck.push({ front: item.text.replace(/_{2,}/g, '___'), back: `Đáp án: ${ans}`, section: sec.title });
            }
          } else if (item.type === 'collocation_word') {
            const ans = getCollocationAnswer(item, optsByNum, ansByNum);
            if (ans) {
              deck.push({ front: item.word, back: formatAnswerLabel(ans), section: sec.title });
            }
          }
        });
      });
      return shuffle(deck);
    }

    function renderFlashcardMode() {
      flashcardDeck = buildFlashcardDeck();
      if (flashcardDeck.length === 0) {
        return '<div class="empty-state"><p>Không có flashcard cho phần này.</p></div>';
      }
      const card = flashcardDeck[flashcardIndex];
      return `<div class="flashcard-container">
        <div class="flashcard-progress">${flashcardIndex + 1} / ${flashcardDeck.length} — ${card.section}</div>
        <div class="flashcard" id="flashcard">
          <div class="flashcard-inner">
            <div class="flashcard-front">
              <div class="flashcard-label">Tiếng Anh</div>
              <p>${escapeHtml(card.front)}</p>
              <div class="flashcard-hint">Nhấn để lật thẻ</div>
            </div>
            <div class="flashcard-back">
              <div class="flashcard-label">Tiếng Việt / Đáp án</div>
              <p style="white-space:pre-line">${escapeHtml(card.back)}</p>
            </div>
          </div>
        </div>
        <div class="flashcard-nav">
          <button id="fcPrev">← Trước</button>
          <button id="fcShuffle" class="primary">🔀 Xáo trộn</button>
          <button id="fcNext">Sau →</button>
        </div>
      </div>`;
    }

    function bindFlashcardEvents() {
      const fc = document.getElementById('flashcard');
      if (fc) fc.addEventListener('click', () => fc.classList.toggle('flipped'));
      document.getElementById('fcPrev')?.addEventListener('click', () => {
        flashcardIndex = (flashcardIndex - 1 + flashcardDeck.length) % flashcardDeck.length;
        renderContent();
      });
      document.getElementById('fcNext')?.addEventListener('click', () => {
        flashcardIndex = (flashcardIndex + 1) % flashcardDeck.length;
        renderContent();
      });
      document.getElementById('fcShuffle')?.addEventListener('click', () => {
        flashcardDeck = shuffle(flashcardDeck);
        flashcardIndex = 0;
        renderContent();
      });
    }

    function buildQuizQuestions() {
      const questions = [];
      const sections = getFilteredSections();
      sections.forEach(sec => {
        sec.items.forEach(item => {
          if (item.type === 'true_false' && item.answer) {
            questions.push({ type: 'tf', statement: item.statement, answer: item.answer });
          } else if (item.type === 'mcq') {
            const ans = getMcqAnswer(item);
            if (ans && ans.key && (item.options || []).length >= 2) {
              questions.push({
                type: 'mcq',
                question: item.question,
                options: item.options,
                answer: ans.key,
                answerText: ans.text
              });
            }
          }
        });
      });
      return shuffle(questions).slice(0, 20);
    }

    function renderQuizMode() {
      if (!quizState) {
        const qs = buildQuizQuestions();
        if (qs.length === 0) {
          return '<div class="empty-state"><p>Không đủ câu hỏi quiz cho phần này. Hãy chọn "Tất cả" hoặc phần có đáp án.</p><button class="reveal-btn" id="startQuiz" style="margin-top:1rem">Bắt đầu với tất cả</button></div>';
        }
        quizState = { questions: qs, current: 0, score: 0, answered: false };
      }

      if (quizState.current >= quizState.questions.length) {
        const pct = Math.round(quizState.score / quizState.questions.length * 100);
        return `<div class="quiz-container"><div class="quiz-score">
          <h3>🎉 Hoàn thành!</h3>
          <p style="font-size:2rem;font-weight:700;color:var(--accent);margin:1rem 0">${quizState.score}/${quizState.questions.length}</p>
          <p style="color:var(--text-muted)">Điểm: ${pct}%</p>
          <button class="reveal-btn" id="restartQuiz" style="margin-top:1.5rem">Làm lại</button>
        </div></div>`;
      }

      const q = quizState.questions[quizState.current];
      const progress = (quizState.current / quizState.questions.length) * 100;

      if (q.type === 'tf') {
        return `<div class="quiz-container">
          <div class="quiz-progress"><div class="quiz-progress-bar" style="width:${progress}%"></div></div>
          <p style="color:var(--text-muted);font-size:.85rem;margin-bottom:1rem">Câu ${quizState.current + 1}/${quizState.questions.length}</p>
          <div class="card" id="quizCard">
            <p class="card-question" style="font-size:1.05rem">${escapeHtml(q.statement)}</p>
            <div class="tf-btns" style="margin-top:1rem">
              <button class="tf-btn quiz-answer" data-ans="T" style="padding:.75rem 2rem">Đúng</button>
              <button class="tf-btn quiz-answer" data-ans="F" style="padding:.75rem 2rem">Sai</button>
            </div>
            <div class="answer-panel" id="quizFeedback" style="display:none;margin-top:1rem"></div>
          </div>
        </div>`;
      }

      const opts = q.options.map(o =>
        `<div class="option quiz-answer" data-ans="${o.key}"><span class="key">${o.key}.</span><span>${escapeHtml(o.text.split('=')[0].trim())}</span></div>`
      ).join('');

      return `<div class="quiz-container">
        <div class="quiz-progress"><div class="quiz-progress-bar" style="width:${progress}%"></div></div>
        <p style="color:var(--text-muted);font-size:.85rem;margin-bottom:1rem">Câu ${quizState.current + 1}/${quizState.questions.length}</p>
        <div class="card" id="quizCard">
          <p class="card-question" style="font-size:1.05rem">${escapeHtml(q.question)}</p>
          <div class="options" style="margin-top:1rem">${opts}</div>
          <div class="answer-panel" id="quizFeedback" style="display:none;margin-top:1rem"></div>
        </div>
      </div>`;
    }

    function bindQuizEvents() {
      document.getElementById('restartQuiz')?.addEventListener('click', () => {
        quizState = null;
        renderContent();
      });
      document.getElementById('startQuiz')?.addEventListener('click', () => {
        currentSection = 'all';
        quizState = null;
        renderNav();
        renderContent();
      });
      document.querySelectorAll('.quiz-answer').forEach(btn => {
        btn.addEventListener('click', () => {
          if (quizState.answered) return;
          const q = quizState.questions[quizState.current];
          const chosen = btn.dataset.ans;
          const correct = q.answer;
          const feedback = document.getElementById('quizFeedback');
          if (chosen === correct) {
            quizState.score++;
            btn.classList.add('revealed-correct');
          } else {
            btn.classList.add('revealed-wrong');
            document.querySelectorAll('.quiz-answer').forEach(b => {
              if (b.dataset.ans === correct) b.classList.add('revealed-correct');
            });
          }
          if (feedback) {
            const label = q.type === 'tf'
              ? (correct === 'T' ? 'ĐÚNG (True)' : 'SAI (False)')
              : formatAnswerLabel({ key: correct, text: q.answerText });
            feedback.innerHTML = `Đáp án đúng: <strong>${escapeHtml(label)}</strong>`;
            feedback.style.display = 'block';
          }
          quizState.answered = true;
          setTimeout(() => {
            quizState.current++;
            quizState.answered = false;
            renderContent();
          }, 1800);
        });
      });
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    loadData();
  </script>
</body>
</html>
